<!-- Design an HTML5 registration form to collect name, email, password, gender, date of birth, city, course, hobbies, and address. Use appropriate HTML5 input types and form controls. -->

<!DOCTYPE html>
<html>
<head>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form>

        Name:
        <input type="text" name="name" required>
        <br>
        <br>

        Email:
        <input type="email" name="email" required>
        <br>
        <br>

        Password:
        <input type="password" name="password" required>
        <br>
        <br>

        Gender:
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br>
        <br>

        Date of Birth:
        <input type="date" name="dob">
        <br>
        <br>

        City:
        <input type="text" name="city">
        <br>
        <br>

        Course:
        <select name="course">
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="BCom">B.Com</option>
            <option value="BA">BA</option>
        </select>
        <br>
        <br>

        Hobbies:
        <input type="checkbox" name="hobbies" value="Reading"> Reading
        <input type="checkbox" name="hobbies" value="Music"> Music
        <input type="checkbox" name="hobbies" value="Sports"> Sports
        <input type="checkbox" name="hobbies" value="Designing"> Designing
        <br>
        <br>

        Address:
        <textarea name="address" rows="4" cols="30"></textarea>
        <br>
        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
