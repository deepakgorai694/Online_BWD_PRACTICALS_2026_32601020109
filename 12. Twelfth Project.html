<!-- Design a visually attractive admission form using CSS. Apply the CSS box model, borders, margins, padding, text effects, and appropriate CSS styling. -->

<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
    <link rel="stylesheet" href="12.style.css">
</head>
<body>

    <div class="form-box">
        <h1>Registration</h1>

        <form>
            <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter first name">
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter last name">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email">
                </div>
                <div class="field">
                    <label>Country</label>
                    <input type="text" placeholder="Enter country">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Course</label>
                    <select>
                        <option>Select Course</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>B.Com</option>
                        <option>BA</option>
                    </select>
                </div>
                <div class="field">
                    <label>Gender</label>
                    <select>
                        <option>Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <label>Date of Birth</label>
            <div class="date-row">
                <select>
                    <option>Month</option>
                    <option>January</option><option>February</option>
                    <option>March</option><option>April</option>
                    <option>May</option><option>June</option>
                    <option>July</option><option>August</option>
                    <option>September</option><option>October</option>
                    <option>November</option><option>December</option>
                </select>
                <select>
                    <option>Day</option>
                    <option>1</option><option>2</option><option>3</option>
                    <option>4</option><option>5</option><option>6</option>
                    <option>7</option><option>8</option><option>9</option>
                    <option>10</option><option>11</option><option>12</option>
                    <option>13</option><option>14</option><option>15</option>
                    <option>16</option><option>17</option><option>18</option>
                    <option>19</option><option>20</option><option>21</option>
                    <option>22</option><option>23</option><option>24</option>
                    <option>25</option><option>26</option><option>27</option>
                    <option>28</option><option>29</option><option>30</option>
                    <option>31</option>
                </select>
                <select>
                    <option>Year</option>
                    <option>2000</option><option>2001</option>
                    <option>2002</option><option>2003</option>
                    <option>2004</option><option>2005</option>
                    <option>2006</option><option>2007</option>
                    <option>2008</option>
                </select>
            </div>

            <label>Address</label>
            <textarea rows="3" placeholder="Enter your address"></textarea>

            <input type="submit" value="SUBMIT">
        </form>
    </div>

</body>
</html>
